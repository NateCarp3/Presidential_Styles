<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presidential Styles</title>
<meta name="description" content="Presidential Styles: men's celebrity stylist, New Jersey.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Spotlight: one full-bleed look, a huge wordmark, then the photos do the talking. */
  --bg:#0a0d18;
  --ink:#efe9dc;
  --gold:#e3bd62;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --body:"Archivo", Helvetica, Arial, sans-serif;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.14em;padding:14px 30px;border:2px solid var(--ink);transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.gold:hover{background:var(--ink);border-color:var(--ink)}

/* hero */
.hero{position:relative;height:min(92vh,880px);min-height:560px;overflow:hidden}
.hero > img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px var(--gutter)}
.mark{font-family:var(--display);font-size:28px;text-decoration:none}
.top .btn{padding:10px 20px;background:rgba(10,13,24,.55)}
.top .btn:hover{background:var(--ink)}
.title{position:absolute;inset:auto 0 0 0;padding:140px var(--gutter) 44px;background:linear-gradient(0deg,rgba(10,13,24,.95),rgba(10,13,24,0))}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(60px,11vw,168px);line-height:.88;letter-spacing:.01em}
.tag{margin:18px 0 0;font-size:15px;font-weight:700;letter-spacing:.18em;color:var(--gold)}

/* looks carousel: one look centred, neighbours faded at the sides */
.looks{--w:min(64vw,460px);position:relative;padding:64px 0 24px}
.track{display:flex;gap:clamp(12px,3vw,32px);overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:8px calc(50% - var(--w)/2) 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 var(--w);scroll-snap-align:center;margin:0;opacity:.28;transform:scale(.88);transition:opacity .4s ease,transform .4s ease;cursor:pointer}
.slide.on{opacity:1;transform:scale(1);cursor:default}
.slide img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#141826;user-select:none;-webkit-user-drag:none}
.ctrl{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:20px}
.arrow{width:48px;height:48px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.arrow:hover{background:var(--ink);color:var(--bg)}
.arrow:disabled{opacity:.3;cursor:default;background:transparent;color:var(--ink)}
.count{font-family:var(--display);font-size:22px;letter-spacing:.06em;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:600px){.looks{--w:74vw;padding-top:40px}}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}.slide{transition:none}}

/* close */
.close{display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px var(--gutter) 88px;text-align:center}
.close h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,80px);line-height:1}
.close .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer{text-align:center;font-size:12px;letter-spacing:.14em;color:#8e97b3;padding:0 var(--gutter) 32px}
</style>
</head>
<body>

<header class="hero">
  <img src="static/lookbook/look-06.jpg" alt="Client in a tonal yellow track set with a crossbody bag">
  <div class="top">
    <a class="mark" href="#" aria-label="Presidential Styles home">P</a>
    <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdY4iMSVjPhfRr5Q740UFEqvqDGJLQX9Ir_fJTYiijJUV1Y7g/viewform?usp=header">BOOK</a>
  </div>
  <div class="title">
    <h1>PRESIDENTIAL<br>STYLES</h1>
    <p class="tag">MEN'S CELEBRITY STYLIST · NEW JERSEY</p>
  </div>
</header>

<main>
  <section class="looks" aria-roledescription="carousel" aria-label="Looks styled by TP">
    <div class="track" id="track" tabindex="0">
      <figure class="slide on"><img src="static/lookbook/look-01.jpg" alt="Distressed graphic tee with washed wide-leg denim"></figure>
      <figure class="slide"><img src="static/lookbook/look-02.jpg" alt="Graphic zip hoodie with studded black denim shorts"></figure>
      <figure class="slide"><img src="static/lookbook/look-03.jpg" alt="Newspaper-print tee with light-wash wide-leg denim"></figure>
      <figure class="slide"><img src="static/lookbook/look-04.jpg" alt="Hooded zip jacket, ribbed tank and distressed denim shorts"></figure>
      <figure class="slide"><img src="static/lookbook/look-05.jpg" alt="Graphic tee layered over a thermal with straight-leg denim"></figure>
      <figure class="slide"><img src="static/lookbook/look-09.jpg" alt="Cream blazer over a turtleneck with green trousers"></figure>
      <figure class="slide"><img src="static/lookbook/look-07.jpg" alt="Sleeveless graphic tee with washed black flared denim"></figure>
      <figure class="slide"><img src="static/lookbook/look-08.jpg" alt="Embellished graphic tee with a fitted cap and shades"></figure>
    </div>
    <div class="ctrl">
      <button class="arrow" id="prev" type="button" aria-label="Previous look">&larr;</button>
      <span class="count" id="count" aria-live="polite">01 / 08</span>
      <button class="arrow" id="next" type="button" aria-label="Next look">&rarr;</button>
    </div>
  </section>

  <section class="close">
    <h2>YOUR TURN.</h2>
    <div class="acts">
      <a class="btn gold" href="https://docs.google.com/forms/d/e/1FAIpQLSdY4iMSVjPhfRr5Q740UFEqvqDGJLQX9Ir_fJTYiijJUV1Y7g/viewform?usp=header">BOOK TP</a>
      <a class="btn" href="https://www.instagram.com/presidenialstyles_/">@PRESIDENIALSTYLES_</a>
    </div>
  </section>
</main>

<footer>© 2026 PRESIDENTIAL STYLES</footer>

<script>
(function(){
  var track=document.getElementById('track'), slides=[].slice.call(track.querySelectorAll('.slide'));
  var prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count');
  var cur=0, n=slides.length, pad=function(i){return String(i).padStart(2,'0');};

  function center(i){
    var s=slides[i];
    track.scrollTo({left:s.offsetLeft-(track.clientWidth-s.offsetWidth)/2,behavior:'smooth'});
  }
  function go(i){center(Math.max(0,Math.min(n-1,i)));}
  function mark(){
    var mid=track.scrollLeft+track.clientWidth/2, best=0, bd=Infinity;
    slides.forEach(function(s,i){var d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid);if(d<bd){bd=d;best=i;}});
    if(best===cur && slides[cur].classList.contains('on'))return;
    cur=best;
    slides.forEach(function(s,i){s.classList.toggle('on',i===cur);});
    count.textContent=pad(cur+1)+' / '+pad(n);
    prev.disabled=cur===0; next.disabled=cur===n-1;
  }
  var raf=0;
  track.addEventListener('scroll',function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(mark);},{passive:true});
  window.addEventListener('resize',function(){center(cur);});
  prev.addEventListener('click',function(){go(cur-1);});
  next.addEventListener('click',function(){go(cur+1);});
  slides.forEach(function(s,i){s.addEventListener('click',function(){if(i!==cur)go(i);});});
  track.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){e.preventDefault();go(cur+1);}
    if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  });

  // mouse drag on desktop
  var down=false, startX=0, startL=0, moved=false;
  track.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;down=true;moved=false;startX=e.clientX;startL=track.scrollLeft;track.style.scrollSnapType='none';track.style.scrollBehavior='auto';});
  window.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;track.scrollLeft=startL-dx;});
  window.addEventListener('pointerup',function(){if(!down)return;down=false;track.style.scrollSnapType='';track.style.scrollBehavior='';mark();center(cur);});
  track.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);

  mark(); prev.disabled=true;
})();
</script>
</body>
</html>
